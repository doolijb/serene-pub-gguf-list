    recommended_vram: 3
    tags: [roleplay, utility, structured-output, vision, long-context, thinking-default-on]
    details:
      parameter_size: 4B
      quantization_level: Q4_K_M
      modified_at: "2026-02"
      description: "Compact Qwen 3.5 with a 262k native context window, the strongest option that still fits an entry-level card. Thinking mode is ON by default - leave it off for roleplay so reasoning traces do not leak into character responses. On Ollama connections thinking is already disabled by default, which also makes this a usable lightweight pick for summarization and extraction tasks."

