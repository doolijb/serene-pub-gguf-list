# name: string
# pull: string
# size: number
# recommended_vram: number
# tags: string[]
# details
#    parameter_size: string
#    quantization_level: string
#    modified_at: string
#    description: string

# tags vocabulary - keep to this list so filtering stays predictable
#   role:       roleplay | storytelling | utility | structured-output | summarization | extraction
#   modality:   vision | audio | tool-calling | long-context
#   reasoning:  thinking-default-on | thinking-default-off | thinking-capable | no-thinking
#   build:      abliterated | uncensored | imatrix | qat | legacy
# long-context means 128k tokens or more. no-thinking means the architecture has no
# reasoning mode at all; thinking-default-off means it has one but does not use it by default.

models:
  # 3GB VRAM Tier - Ultra Budget
